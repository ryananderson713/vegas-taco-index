name: Refresh prices

on:
  schedule:
    # Mondays 13:00 UTC (6am Pacific). Prices move slowly; weekly is plenty
    # and keeps the request volume polite.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

# Let the built-in token push the refreshed data back.
permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Scrape current prices
        run: python3 scrape.py

      - name: Did prices actually move?
        id: check
        run: |
          # Exits 0 when store/item prices differ, 1 when only the timestamp did.
          if python3 price_changed.py > change.txt 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          cat change.txt

      - name: Rebuild pages
        if: steps.check.outputs.changed == 'true'
        run: python3 build.py

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f change.txt
          git add -A
          git commit -m "Refresh prices ($(date -u +%Y-%m-%d))"
          git push
          echo "Pushed updated prices; Pages will redeploy."

      - name: Nothing to do
        if: steps.check.outputs.changed != 'true'
        run: echo "Prices unchanged — repo left untouched."
